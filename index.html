<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZaviTale – מסע אל המבחן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;font-family:'Rubik',system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:absolute;left:50%;top:50%;width:640px;height:540px;transform-origin:center center;transform:translate(-50%,-50%)}
#cv{position:absolute;left:0;top:0;width:640px;height:540px;image-rendering:pixelated}
.scene{position:absolute;inset:0;display:none;pointer-events:none}
.scene.on *{pointer-events:auto}
.scene.on{display:block}
.ltr{direction:ltr;unicode-bidi:isolate;margin:0 .08em}
.pix{font-family:'Press Start 2P',monospace}
button{font-family:inherit;cursor:pointer}
.c{visibility:hidden}
.c.v{visibility:visible}
.hrt{display:inline-block;width:18px;height:16px;vertical-align:middle}
.hrt svg{width:100%;height:100%;display:block}

/* generic undertale box */
.ubox{position:absolute;border:4px solid #fff;background:#000;box-sizing:border-box}
#dlg{left:32px;top:388px;width:576px;height:136px;padding:14px 22px;font:700 20px/1.5 Rubik;display:none;z-index:5}
#dlg.on{display:block}

/* title */
#titleBtns{position:absolute;left:0;right:0;top:300px;display:flex;flex-direction:column;align-items:center;gap:12px}
.tbtn{background:#000;color:#fff;border:3px solid #fff;font:700 21px Rubik;padding:8px 26px;min-width:260px;display:flex;align-items:center;justify-content:center;gap:10px}
.tbtn:hover,.tbtn:focus-visible,.tbtn.sel{color:#ff0;border-color:#ff0;outline:none}
.trow{display:flex;gap:10px}
.trow .tbtn{min-width:0;font-size:16px;padding:6px 14px}
#titleHelp{position:absolute;left:0;right:0;bottom:10px;text-align:center;font:500 13px Rubik;color:#888}

/* name */
#scName .wrapn{position:absolute;left:0;right:0;top:150px;text-align:center}
#scName h2{font:700 26px Rubik;margin:0 0 24px}
#nameIn::placeholder{color:#555}
#nameIn.err{border-bottom-color:#f44}
#nameIn{background:#000;color:#ff0;border:none;border-bottom:3px solid #fff;font:700 34px Rubik;text-align:center;width:300px;outline:none;padding:6px;-webkit-user-select:text;user-select:text}
#nameOk{margin-top:30px}

/* map */
#mapHud{position:absolute;left:32px;right:32px;top:8px;height:34px;display:flex;align-items:center;gap:14px;font:700 17px Rubik}
#mapHud .sp{flex:1}
.sbtn{background:#000;color:#fff;border:2px solid #fff;font:700 14px Rubik;padding:4px 12px}
.sbtn:hover{color:#ff0;border-color:#ff0}
#mapInfo{left:32px;top:402px;width:576px;height:124px;padding:12px 20px;font:700 19px/1.45 Rubik}
#mapInfo .t1{font-size:22px;color:#ff0}
#mapInfo .t2{color:#ccc;font-size:16px}
#mapInfo .go{position:absolute;left:16px;bottom:10px;font-size:15px;color:#fff;background:#000;border:2px solid #ff7f27;color:#ff7f27;padding:6px 14px}
#mapInfo .go:hover{color:#ff0;border-color:#ff0}

/* battle */
#qPanel{position:absolute;left:20px;top:4px;width:600px;height:242px;display:none;flex-direction:column;align-items:center;justify-content:flex-start}
#qPanel.on{display:flex}
#qText{font:700 21px/1.38 Rubik;text-align:center;min-height:62px;display:flex;align-items:center;justify-content:center;padding:0 8px}
#qPanel.nosvg #qText{flex:1;font-size:25px}
#qSvg svg{display:block}
#bubble{position:absolute;left:400px;top:40px;max-width:190px;background:#fff;color:#000;font:700 16px/1.35 Rubik;padding:8px 12px;border-radius:6px;display:none}
#bubble::after{content:'';position:absolute;right:100%;top:18px;border:8px solid transparent;border-right-color:#fff}
#bubble.on{display:block}
#boxText{position:absolute;left:54px;top:266px;width:532px;height:138px;font:700 19.5px/1.5 Rubik;overflow:hidden}
#boxText.small{font-size:17px;line-height:1.45}
#opts{position:absolute;left:46px;top:262px;width:548px;height:146px;display:none;grid-template-columns:1fr 1fr;gap:8px 12px;align-content:center}
#opts.on{display:grid}
#opts.one{grid-template-columns:1fr;gap:5px}
.opt{background:#000;color:#fff;border:2px solid #fff;font:700 20px Rubik;padding:6px 34px 6px 10px;position:relative;text-align:right;min-height:42px;line-height:1.25}
#opts.one .opt{font-size:15.5px;min-height:30px;padding:4px 34px 4px 8px}
.opt .hrt{position:absolute;right:8px;top:50%;margin-top:-8px;visibility:hidden}
.opt.sel{color:#ff0;border-color:#ff0}
.opt.sel .hrt{visibility:visible}
.opt.good{color:#3f3!important;border-color:#3f3!important}
.opt.bad{color:#f44!important;border-color:#f44!important}
#hud{position:absolute;left:32px;top:418px;width:576px;height:30px;display:flex;align-items:center;gap:10px;font:700 17px Rubik}
#hud .lv{font-family:'Press Start 2P';font-size:12px}
.bar{display:inline-block;width:90px;height:18px;background:#c00;position:relative}
.bar i{position:absolute;right:0;top:0;bottom:0;background:#ff0;width:100%;transition:width .25s}
#convBar{background:#333;width:100px}
#convBar i{background:#ffd400}
#hud .sp{flex:1}
#monName.ready{color:#ff0}
#menu{position:absolute;left:32px;top:456px;width:576px;height:60px;display:flex;gap:12px}
.mbtn{flex:1;background:#000;border:3px solid #ff7f27;color:#ff7f27;font:700 21px Rubik;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;position:relative;padding:0}
.mbtn small{font:8px 'Press Start 2P';margin-top:5px;opacity:.85}
.mbtn .hrt{position:absolute;right:10px;top:50%;margin-top:-8px;visibility:hidden}
.mbtn.sel{border-color:#ff0;color:#ff0}
.mbtn.sel .hrt{visibility:visible}
.mbtn.ready{color:#ff0;animation:glow 1s infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 #ff0}to{box-shadow:0 0 14px #ff0}}
#menu.off .mbtn{opacity:.35;pointer-events:none}
#flee{position:absolute;left:8px;top:8px;background:#000;color:#888;border:2px solid #555;font:700 13px Rubik;padding:3px 10px;display:none;z-index:4}
#flee.on{display:block}

/* game over */
#overText{position:absolute;left:60px;right:60px;top:300px;text-align:center;font:700 22px/1.6 Rubik}
#overBtns{position:absolute;left:0;right:0;top:430px;display:none;justify-content:center;gap:14px}
#overBtns.on{display:flex}

#muteBtn{position:absolute;left:8px;bottom:6px;background:none;border:none;color:#777;font-size:18px;z-index:9;padding:2px 6px}

/* floating toast */
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#000;border:2px solid #ff0;color:#ff0;font:700 15px Rubik;padding:5px 14px;display:none;z-index:20}

/* parent dashboard */
#parent{position:fixed;inset:0;background:#0b0b12;color:#eee;overflow:auto;display:none;z-index:100;touch-action:auto;-webkit-user-select:text;user-select:text;font:500 15px/1.5 Rubik}
#parent.on{display:block}
#parent .pw{max-width:980px;margin:0 auto;padding:22px 18px 60px}
#parent h1{font:900 26px Rubik;margin:0;display:flex;align-items:center;gap:10px}
#parent h1 .pix{font-size:13px;color:#ff0}
#parent h2{font:700 18px Rubik;margin:28px 0 10px;color:#ffd400}
.ptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ptop .sp{flex:1}
.chip{display:inline-block;border:1px solid #555;border-radius:999px;padding:3px 12px;font-size:13px;color:#ccc}
.chip.ok{border-color:#3a6;color:#7e7}
.pbtn{background:#1c1c28;color:#fff;border:1px solid #444;border-radius:8px;padding:7px 14px;font:700 14px Rubik}
.pbtn:hover{border-color:#ffd400}
.pbtn.danger{border-color:#733;color:#f99}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.card{background:#151520;border:1px solid #2a2a3a;border-radius:10px;padding:12px 14px}
.card b{display:block;font:900 26px Rubik;color:#fff}
.card span{color:#aaa;font-size:13px}
table.pt{width:100%;border-collapse:collapse;font-size:14px}
table.pt th{text-align:right;color:#999;font-weight:700;border-bottom:1px solid #333;padding:6px 8px}
table.pt td{border-bottom:1px solid #222;padding:7px 8px;vertical-align:middle}
.pbar{height:12px;background:#262636;border-radius:6px;overflow:hidden;min-width:120px;position:relative}
.pbar i{position:absolute;right:0;top:0;bottom:0;border-radius:6px}
.rec{background:#1a1a10;border:1px solid #554;border-radius:10px;padding:12px 14px;margin-top:12px}
.days{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:10px;direction:ltr}
.day{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:#888}
.day .col{width:100%;max-width:34px;background:#2d6cdf;border-radius:4px 4px 0 0;position:relative}
.day .col i{position:absolute;left:0;right:0;bottom:0;background:#36c36b;border-radius:4px 4px 0 0}
.day .n{color:#ccc;font-size:11px}
.legend{font-size:12px;color:#999;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 2px;vertical-align:middle}
.muted{color:#888}
.mist td:nth-child(4){color:#f88}
.mist td:nth-child(5){color:#8f8}
#copyArea{width:100%;height:160px;background:#111;color:#eee;border:1px solid #444;margin-top:8px;display:none;font:13px monospace;direction:rtl}
.note{font-size:13px;color:#999;margin-top:8px}
.pview{margin-top:18px;display:flex;align-items:center;gap:10px;font-weight:700;background:#151520;border:1px solid #2a2a3a;border-radius:10px;padding:10px 14px}
.pview select{background:#000;color:#ff0;border:1px solid #555;border-radius:6px;font:700 15px Rubik;padding:4px 8px}
tr.psel td{background:#1d1d10}
.pick{padding:4px 10px;font-size:12px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1280" height="1080"></canvas>

  <div id="scTitle" class="scene">
    <div id="titleBtns">
      <button class="tbtn" id="btnStart">התחל</button>
      <div class="trow">
        <button class="tbtn" id="btnSound">צליל: פועל</button>
        <button class="tbtn" id="btnDodge">קרבות התחמקות: פועל</button>
      </div>
    </div>
    <div id="titleHelp">חיצים – תנועה · Z / Enter – בחירה · X – חזרה · אפשר גם ללחוץ ולגעת במסך</div>
  </div>

  <div id="scName" class="scene">
    <div class="wrapn">
      <h2>איך קוראים לך?</h2>
      <input id="nameIn" maxlength="12" autocomplete="off" value="" placeholder="השם שלך">
      <div><button class="tbtn" id="nameOk" style="margin:30px auto 0">זהו!</button></div>
    </div>
  </div>

  <div id="scMap" class="scene">
    <div id="mapHud"><span id="mapName"></span><span class="pix" id="mapLv" style="font-size:12px"></span><span class="sp"></span><button class="sbtn" id="btnMenu">תפריט</button></div>
    <div id="mapInfo" class="ubox"></div>
  </div>

  <div id="scBattle" class="scene">
    <div id="qPanel"><div id="qText"></div><div id="qSvg"></div></div>
    <div id="bubble"></div>
    <div id="boxText"></div>
    <div id="opts"></div>
    <div id="hud"><span id="hudName"></span><span class="lv" id="hudLv"></span><span>HP</span><span class="bar" id="hpBar"><i></i></span><span id="hpNum" class="ltr"></span><span class="sp"></span><span id="monName"></span><span class="bar" id="convBar"><i></i></span></div>
    <div id="menu">
      <button class="mbtn" data-i="0"><span class="hrt"></span>ענה<small>FIGHT</small></button>
      <button class="mbtn" data-i="1"><span class="hrt"></span>רמז<small>ACT</small></button>
      <button class="mbtn" data-i="2"><span class="hrt"></span>פריט<small>ITEM</small></button>
      <button class="mbtn" data-i="3"><span class="hrt"></span>רחמים<small>MERCY</small></button>
    </div>
    <button id="flee">🏃 ברח</button>
  </div>

  <div id="scOver" class="scene">
    <div id="overText"></div>
    <div id="overBtns"><button class="tbtn" id="btnRetry" style="min-width:170px">נסה שוב</button><button class="tbtn" id="btnOverMap" style="min-width:170px">חזרה למפה</button></div>
  </div>

  <div id="dlg" class="ubox"></div>
  <div id="toast"></div>
  <button id="muteBtn" title="צליל">🔊</button>
</div>

<div id="parent"><div class="pw" id="pw"></div></div>

<script>
'use strict';
/* ================= basics ================= */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const stage=$('#stage'), cv=$('#cv'), ctx=cv.getContext('2d');
const W=640,H=540;
ctx.scale(2,2); ctx.imageSmoothingEnabled=false;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function strip(h){const d=document.createElement('div');d.innerHTML=String(h).replace(/<span class="ltr">([^<]*)<\/span>/g,'\u2066$1\u2069');return d.textContent.replace(/\s+/g,' ').trim()}

function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* ================= storage ================= */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const save=Object.assign({name:'',cleared:{},sound:true,dodge:true,introSeen:false},LS.get('dipotale_save',{}));
function persist(){LS.set('dipotale_save',save)}
const log=LS.get('dipotale_log_v1',{sessions:{}});
if(!log.sessions)log.sessions={};
function newSession(){return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),player:save.name||'',start:Date.now(),last:Date.now(),answers:[],battles:[],ver:1}}
let session=newSession();
function touchSession(){session.player=save.name;session.last=Date.now();log.sessions[session.id]=session;LS.set('dipotale_log_v1',log);syncSoon()}
function recAnswer(a){if(session.answers.length>=700)session=newSession();session.answers.push(a);touchSession()}
function recBattle(b){session.battles.push(b);touchSession()}

/* cloud sync: Firebase (when configured) or the Claude artifact db */
const FIREBASE_CONFIG={apiKey:"AIzaSyDK2xEKqsi3PGfTWXQjVzlT_krxb5i8M3M",authDomain:"zavitale.firebaseapp.com",projectId:"zavitale",storageBucket:"zavitale.firebasestorage.app",messagingSenderId:"845240579650",appId:"1:845240579650:web:5b7862e14c1db9af649fdb"};
let db=null,backend='none',fbAuth=null;const cloud={state:'checking',writable:true,inflight:false,dirty:false,timer:null};
function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=rej;document.head.appendChild(el)})}
async function initFirebase(){
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  await loadScript(B+'firebase-app-compat.js');await loadScript(B+'firebase-auth-compat.js');await loadScript(B+'firebase-firestore-compat.js');
  firebase.initializeApp(FIREBASE_CONFIG);fbAuth=firebase.auth();
  await new Promise(r=>{const u=fbAuth.onAuthStateChanged(()=>{u();r()})});
  if(!fbAuth.currentUser)await fbAuth.signInAnonymously();
  return firebase.firestore();
}
(async()=>{
  try{
    const inClaude=!!(window.claude&&typeof window.claude.use==='function');
    if(FIREBASE_CONFIG&&!inClaude){db=await initFirebase();backend='firebase'}
    else if(inClaude){db=await window.claude.use('db');backend=db?'claude':'none'}
  }catch(e){db=null;backend='none'}
  cloud.state=db?'on':'off';if(db&&session.answers.length)syncSoon();
  if(location.hash==='#parents'&&$('#parent').classList.contains('on'))openParent();
})();
function syncSoon(){if(!db||!cloud.writable)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(syncNow,1500)}
async function syncNow(){
  if(!db||!cloud.writable)return;
  if(!session.answers.length&&!session.battles.length)return;
  if(cloud.inflight){cloud.dirty=true;return}
  cloud.inflight=true;
  try{if(backend==='firebase'){if(!fbAuth.currentUser)await fbAuth.signInAnonymously();session.uid=fbAuth.currentUser.uid}
    await db.collection('sessions').doc(session.id).set(JSON.parse(JSON.stringify(session)));cloud.state='on';cloud.lastSync=Date.now()}
  catch(e){const c=e&&e.code;if(c==='unavailable'||c==='resource_exhausted'||c==='resource-exhausted'||c==='deadline-exceeded'){setTimeout(syncSoon,3000+Math.random()*3000)}else{cloud.writable=false;cloud.state='readonly'}}
  finally{cloud.inflight=false;if(cloud.dirty){cloud.dirty=false;syncSoon()}}
}
addEventListener('pagehide',()=>{if(db&&cloud.writable)syncNow()});

/* ================= audio ================= */
let AC=null,master=null,sfxG=null,noiseBuf=null,wantSong=null;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=save.sound?1:0;master.connect(AC.destination);
    sfxG=AC.createGain();sfxG.gain.value=.7;sfxG.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    if(wantSong){const w=wantSong;wantSong=null;playSong(w)}
  }catch(e){AC=null}
}
addEventListener('pointerdown',audioInit,true);addEventListener('keydown',audioInit,true);
const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function freq(n){const m=n.match(/^([A-G][#b]?)(\d)$/);if(!m)return 440;const midi=12*(+m[2]+1)+NOTE[m[1]];return 440*Math.pow(2,(midi-69)/12)}
function tone(f,t,dur,type,vol,dest,slide){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';
  o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.006);g.gain.setValueAtTime(vol,t+Math.max(0.01,dur*0.55));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+0.03);
}
function noise(t,dur,vol,hp,dest){if(!AC)return;const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp||1000;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t);s.stop(t+dur+.03)}
const now=()=>AC?AC.currentTime:0;
let blipPitch=520;
const SFX={
  blip(){if(!AC)return;tone(blipPitch*(0.97+Math.random()*.06),now(),0.045,'square',0.05)},
  move(){tone(660,now(),0.04,'square',0.05)},
  ok(){const t=now();tone(880,t,0.05,'square',0.06);tone(1320,t+0.05,0.07,'square',0.06)},
  correct(){const t=now();[523,659,784,1047].forEach((f,i)=>tone(f,t+i*0.06,0.12,'square',0.07))},
  wrong(){const t=now();tone(196,t,0.18,'sawtooth',0.07);tone(147,t+0.16,0.28,'sawtooth',0.07)},
  hurt(){const t=now();noise(t,0.15,0.25,600);tone(330,t,0.25,'square',0.08,null,70)},
  heal(){const t=now();[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*0.05,0.1,'triangle',0.12))},
  spare(){const t=now();for(let i=0;i<10;i++)tone(1200+Math.random()*1600,t+i*0.045,0.08,'triangle',0.06)},
  save(){const t=now();tone(1047,t,0.15,'triangle',0.15);tone(1568,t+0.12,0.2,'triangle',0.15);tone(2093,t+0.26,0.35,'triangle',0.12)},
  appear(){const t=now();tone(200,t,0.35,'square',0.06,null,900)},
  shatter(){const t=now();noise(t,0.4,0.3,300);tone(500,t,0.4,'square',0.07,null,60)},
  step(){tone(300,now(),0.03,'triangle',0.08)}
};

/* --- tiny sequencer --- */
const SONGS={

const parsed={};
function parseTrack(str){const toks=str.trim().split(/\s+/);const by={};let cur=null;toks.forEach((tk,i)=>{if(tk==='-'){if(cur)cur.len++}else if(tk==='.'){cur=null}else{cur={len:1,f:freq(tk)};by[i]=cur}});return{by,len:toks.length}}
let seq={name:null,timer:null,gain:null};
function playSong(name){
  if(!AC){wantSong=name;return}
  if(seq.name===name)return;stopSong();
  const S=SONGS[name];if(!S)return;
  if(!parsed[name])parsed[name]=S.tracks.map(t=>parseTrack(t.n));
  const g=AC.createGain();g.gain.value=.6;g.connect(master);
  seq={name,S,P:parsed[name],step:0,t:AC.currentTime+0.08,gain:g,total:Math.max(...parsed[name].map(p=>p.len))};
  seq.timer=setInterval(schedule,25);
}
function schedule(){
  const s=seq;if(!s.S)return;const spb=60/s.S.bpm/2;
  while(s.t<AC.currentTime+0.15){
    if(!s.S.loop&&s.step>=s.total){clearInterval(s.timer);s.timer=null;return}
    s.P.forEach((p,i)=>{const e=p.by[s.step%p.len];if(e){const tr=s.S.tracks[i];tone(e.f,s.t,e.len*spb*0.9,tr.w,tr.v,s.gain)}});
    const dr=s.S.dr;if(dr){const c=dr[s.step%dr.length];if(c==='h')noise(s.t,0.04,0.05,7000,s.gain);else if(c==='s')noise(s.t,0.12,0.12,1500,s.gain);else if(c==='k')tone(140,s.t,0.12,'sine',0.35,s.gain,45)}
    s.step++;s.t+=spb;
  }
}
function stopSong(){if(seq.timer)clearInterval(seq.timer);if(seq.gain&&AC){const g=seq.gain;g.gain.setTargetAtTime(0,AC.currentTime,0.04);setTimeout(()=>{try{g.disconnect()}catch(e){}},600)}seq={name:null,timer:null,gain:null};wantSong=null}

let pending=null,typing=null,keys={};
const isConfirm=k=>k==='Enter'||k==='z'||k==='Z'||k===' '||k==='ז';
const isBack=k=>k==='x'||k==='X'||k==='Escape'||k==='Shift'||k==='ס';
addEventListener('keydown',e=>{
  if($('#parent').classList.contains('on')){if(e.key==='Escape')closeParent();return}
  if(document.activeElement===$('#nameIn')){if(e.key==='Enter')$('#nameOk').click();return}
  keys[e.key]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(isConfirm(e.key))e.preventDefault();
  if(e.repeat&&isConfirm(e.key))return;
  if(typing&&isConfirm(e.key)){typing.skip=true;return}
  if(pending&&pending.key&&pending.key(e.key))return;
  if(scene==='title'&&isConfirm(e.key))$('#btnStart').click();
  if(scene==='map')mapKey(e.key);
});
addEventListener('keyup',e=>{keys[e.key]=false});
stage.addEventListener('pointerup',e=>{
  if(e.target.closest('button')||e.target.closest('input'))return;
  if(typing){typing.skip=true;return}
  if(pending&&pending.type==='confirm'){const p=pending;pending=null;p.res()}
});
function waitConfirm(){return new Promise(res=>{pending={type:'confirm',res,key:k=>{if(isConfirm(k)){pending=null;res();return true}return false}}})}

function spawn(D){
  const bx=box;const g=pick(D.glyphs);const s=D.spd;
  const mk=(x,y,vx,vy)=>bullets.push({x,y,vx,vy,g,r:7});
  switch(D.pat){
    case 'rain':mk(bx.x+10+Math.random()*(bx.w-20),bx.y-10,0,(90+Math.random()*60)*s);break;
    case 'rise':mk(bx.x+10+Math.random()*(bx.w-20),bx.y+bx.h+10,0,-(90+Math.random()*50)*s);break;
    case 'sides':{const l=(D.flip++)%2===0;mk(l?bx.x-10:bx.x+bx.w+10,bx.y+10+Math.random()*(bx.h-20),(l?1:-1)*(100+Math.random()*50)*s,0);break}
    case 'aim':{const side=R(0,3);let x,y;if(side===0){x=bx.x+Math.random()*bx.w;y=bx.y-10}else if(side===1){x=bx.x+Math.random()*bx.w;y=bx.y+bx.h+10}else if(side===2){x=bx.x-10;y=bx.y+Math.random()*bx.h}else{x=bx.x+bx.w+10;y=bx.y+Math.random()*bx.h}const d=Math.hypot(heart.x-x,heart.y-y)||1;const v=110*s;mk(x,y,(heart.x-x)/d*v,(heart.y-y)/d*v);break}
    case 'burst':{const cx=bx.x+20+Math.random()*(bx.w-40);const n=5;for(let i=0;i<n;i++){const a=Math.PI*(0.2+0.6*i/(n-1));mk(cx,bx.y-6,Math.cos(a)*80*s,Math.sin(a)*80*s)}D.next+=D.rate*1.6;break}
  }
}
function updDodge(dt){

  if(D.t<D.ms-600&&D.t>=D.next){spawn(D);D.next+=D.rate*(0.7+Math.random()*0.6)}

  if(dx&&dy){dx*=0.707;dy*=0.707}

  heart.x=clamp(heart.x,box.x+11,box.x+box.w-11);heart.y=clamp(heart.y,box.y+10,box.y+box.h-10);
  if(heart.inv>0)heart.inv-=dt;

    if(heart.inv<=0&&Math.hypot(b.x-heart.x,b.y-heart.y)<b.r+5){heart.inv=1;b.dead=true;B.hp-=D.dmg;shake=10;SFX.hurt();hud();if(B.hp<=0){D.t=D.ms}}});

}

function drawBattle(dt){

  if(monVisible){

    if(monShake>0){x+=Math.sin(T*60)*monShake*0.5;monShake=Math.max(0,monShake-dt*30)}

  }

  // box
  ['x','y','w','h'].forEach(k=>box[k]+=(boxT[k]-box[k])*Math.min(1,dt*12));
  ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(box.x,box.y,box.w,box.h);
  // bullets
  ctx.save();ctx.beginPath();ctx.rect(box.x+2,box.y+2,box.w-4,box.h-4);ctx.clip();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='ltr';
  bullets.forEach(b=>{ctx.font=(b.g.length>2?"11px":"16px")+" 'Press Start 2P', Rubik";ctx.fillText(b.g,b.x,b.y)});
  ctx.restore();
  if(heart.show&&!(heart.inv>0&&Math.floor(T*15)%2))drawHeart(heart.x,heart.y,2);
  // floats
  floats.forEach(f=>{f.y-=dt*30;f.life-=dt;ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle=f.col;ctx.font="900 22px Rubik";ctx.textAlign='center';ctx.direction='rtl';ctx.fillText(f.s,f.x,f.y)});floats=floats.filter(f=>f.life>0);ctx.globalAlpha=1;ctx.direction='ltr';ctx.textAlign='start';
}

function summaryText(){
  const d=parentData;if(!d)return'';
  let s=`סיכום תרגול ZaviTale${d.player?' – '+d.player:' – כל התלמידים'} – ${new Date().toLocaleDateString('he-IL')}\n`;
  s+=`שאלות: ${d.total} · הצלחה: ${d.pc}% · דקות תרגול: ${d.mins}\n\n`;
  TOPIC_ORDER.forEach(k=>{const p=d.per[k];s+=`${tname(k)}: ${p.n?Math.round(p.c/p.n*100)+'% ('+p.c+'/'+p.n+')':'לא תורגל'}\n`});
  if(d.weak.length)s+=`\nכדאי לחזק: ${d.weak.map(tname).join(', ')}\n`;
  if(d.mistakes.length){s+=`\nטעויות אחרונות:\n`;d.mistakes.slice(0,10).forEach(a=>{s+=`• ${d.player?'':a.player+': '}${a.q} — ענה ${a.a}, נכון: ${a.c}\n`})}
  return s;
}

setSound(save.sound);

requestAnimationFrame(frame);
</script>
